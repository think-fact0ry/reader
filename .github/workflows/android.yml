name: APK 빌드

# 안드로이드 SDK를 PC에 설치하지 않기 위해 GitHub이 대신 빌드한다.
# 결과 APK는 Releases의 'apk-latest' 태그에 붙어 폰에서 바로 내려받을 수 있다.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK 빌드
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 이름 붙이기
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/생각공작소_문서리더.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 생각공작소 문서 리더 (최신 APK)
          body: |
            폰에서 이 페이지의 apk 파일을 눌러 설치하세요.
            처음 설치할 때만 "이 출처의 앱 설치 허용"을 켜 주면 됩니다.
            (화면·기능은 웹에서 자동으로 최신이 됩니다 — 이 앱은 파일을 열어주는 껍데기입니다)
          files: out/*.apk
          fail_on_unmatched_files: true
