<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<title>생각공작소 문서 리더기</title>
<meta name="description" content="한글(.hwp/.hwpx)·엑셀·PDF 서류를 광고 없이 읽어요">
<meta property="og:title" content="생각공작소 문서 리더기">
<meta property="og:description" content="한글·엑셀·PDF 서류를 광고 없이 읽는 뷰어">
<meta property="og:image" content="https://think-fact0ry.github.io/reader/icons/icon-512.png">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<link rel="stylesheet" href="app.css">
<script>
  // 카톡 인앱 브라우저에서 열리면 기본 브라우저로 즉시 전환 (선례=saenggak/kakao-escape.js, 유성 2026-07-04 확정).
  // 문서리더에선 특히 중요하다: 카톡 인앱은 앱 파일(apk) 다운로드를 자체 처리해 '어디 저장됐는지 모르는' 상태가 된다(유성 08-12 실사용).
  // 스킴이 실패해도 페이지는 그대로 동작한다(무해).
  (function () {
    if (/KAKAOTALK/i.test(navigator.userAgent)) {
      location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
    }
  })();
</script>
</head>
<body>

<!-- ── 문서함 ── -->
<section class="view on" id="listView">
  <div class="da-head">
    <div>
      <span class="da-brand">생각공작소</span>
      <div class="da-title">문서 리더기</div>
    </div>
  </div>
  <div class="topbanner" id="inappBanner" style="display:none">
    카카오톡·네이버 앱 안 브라우저에서는 문서가 따로 저장돼 목록이 이어지지 않아요.
    <button id="openChrome">Chrome으로 열기</button>
  </div>
  <button class="da-open" id="btnOpen">파일 열기</button>
  <div class="installbar" id="installBar"><span>홈 화면에 설치하면 공유로 바로 열 수 있어요</span><button id="btnInstall">설치</button></div>
  <div class="da-sec" id="recentSec" style="display:none">최근 연 문서</div>
  <div class="da-list" id="docList"></div>
  <!-- accept 규칙(유성 08-12 실측 2회):
       · 이미지 MIME이 하나라도 있으면 '작업 선택'에 카메라가 뜬다
       · accept를 아예 빼면 */* 가 되어 카메라 + 캠코더까지 뜬다
       ⇒ 이미지·영상·소리 형식을 하나도 넣지 않은 문서 전용 목록으로 고정한다(카메라 후보가 사라져 파일 앱으로 직행).
       한글 파일이 형식 없이(octet-stream) 오는 경우가 많아 그것까지 포함한다. -->
  <input type="file" id="fileInput" multiple style="display:none"
    accept="application/pdf,application/x-hwp,application/haansofthwp,application/vnd.hancom.hwp,application/vnd.hancom.hwpx,application/hwp,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,application/vnd.ms-excel.sheet.macroenabled.12,application/zip,application/octet-stream,text/csv,text/plain,.hwp,.hwpx,.pdf,.xlsx,.xls,.xlsm,.csv">
</section>

<!-- ── 뷰어 ── -->
<section class="view" id="viewerView">
  <div class="vtop">
    <button class="bk" id="btnBack" aria-label="뒤로">
      <svg class="ic" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <span class="fn" id="vTitle"></span>
    <button class="savebtn" id="btnSave" style="display:none">저장</button>
    <button class="kb" id="btnMenu" aria-label="메뉴">⋮</button>
  </div>
  <div class="vbody" id="vBody"></div>
  <div class="editbar" id="editBar">
    <span class="eref" id="editRef">A1</span>
    <input id="editInput" type="text" autocomplete="off" enterkeyhint="done">
    <button class="eok" id="editOk">확인</button>
  </div>
  <div class="vfoot" id="vFoot"></div>
</section>

<!-- ── 로딩 ── -->
<div class="loading" id="loading">
  <div class="bar"><i id="loadBar"></i></div>
  <div class="msg" id="loadMsg">문서를 여는 중이에요</div>
  <button class="cancel" id="loadCancel">그만두기</button>
</div>

<!-- ── ⋮ 바텀시트 ── -->
<div class="sheetbg" id="sheetBg"></div>
<div class="bsheet" id="menuSheet">
  <button class="bi" id="miShare">공유</button>
  <button class="bi" id="miPrint">출력</button>
  <button class="bi danger" id="miRemove">목록에서 지우기</button>
  <button class="close" id="miClose">닫기</button>
</div>

<!-- ── 수정본 저장 시트 ── -->
<div class="bsheet" id="saveSheet">
  <div class="bhead" id="saveHead">고친 내용을 어떻게 할까요?</div>
  <button class="bi" id="svShare">메일·카톡으로 보내기</button>
  <button class="bi" id="svDown">폰에 저장하기</button>
  <button class="bi danger" id="svReset">고친 내용 되돌리기</button>
  <button class="close" id="svClose">닫기</button>
</div>

<!-- ── 암호 입력 ── -->
<div class="dlg" id="pwDlg">
  <div class="box">
    <h3>암호가 걸린 문서예요</h3>
    <p id="pwMsg">문서를 열려면 암호를 입력해 주세요.</p>
    <input type="password" id="pwInput" inputmode="text" autocomplete="off">
    <div class="row"><button class="ghost" id="pwCancel">취소</button><button class="go" id="pwGo">열기</button></div>
  </div>
</div>

<!-- ── 스낵바 ── -->
<div class="snack" id="snack"><span id="snackMsg"></span><button id="snackAct"></button></div>

<!-- ── 종료 확인(§4.11-4 ex18) — 태블릿 허브 #exitHint·06 Apply .exithint·근태와 **같은 박스·같은 문구**(앱 전 표면 공통) -->
<div id="exitHint"><span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>한 번 더 뒤로 가면 나가요.</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
