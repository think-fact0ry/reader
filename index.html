<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>문서리더</title>
<meta name="description" content="한글(.hwp/.hwpx)·엑셀·PDF 서류를 광고 없이 읽어요">
<meta property="og:title" content="문서리더">
<meta property="og:description" content="한글·엑셀·PDF 서류를 광고 없이 읽는 뷰어">
<meta property="og:image" content="https://think-fact0ry.github.io/reader/icons/icon-512.png">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ── 문서함 ── -->
<section class="view on" id="listView">
  <div class="da-head"><div class="da-title">문서</div></div>
  <div class="topbanner" id="inappBanner" style="display:none">
    카카오톡·네이버 앱 안 브라우저에서는 문서가 따로 저장돼 목록이 이어지지 않아요.
    <button id="openChrome">Chrome으로 열기</button>
  </div>
  <button class="da-open" id="btnOpen">파일 열기</button>
  <div class="da-hint">메일·카톡에서 공유 → 문서리더로 바로 열 수 있어요</div>
  <div class="installbar" id="installBar"><span>홈 화면에 설치하면 공유로 바로 열 수 있어요</span><button id="btnInstall">설치</button></div>
  <div class="da-sec" id="recentSec" style="display:none">최근 연 문서</div>
  <div class="da-list" id="docList"></div>
  <input type="file" id="fileInput" multiple style="display:none"
    accept=".hwp,.hwpx,.pdf,.xlsx,.xls,.xlsm,.csv,.jpg,.jpeg,.png,.gif,.webp,application/pdf,application/x-hwp,application/haansofthwp,application/vnd.hancom.hwp,application/vnd.hancom.hwpx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,image/*">
</section>

<!-- ── 뷰어 ── -->
<section class="view" id="viewerView">
  <div class="vtop">
    <button class="bk" id="btnBack" aria-label="뒤로">
      <svg class="ic" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <span class="fn" id="vTitle"></span>
    <button class="kb" id="btnMenu" aria-label="메뉴">⋮</button>
  </div>
  <div class="vseg-wrap" id="segWrap" style="display:none">
    <div class="vseg"><button id="segRead">읽기</button><button id="segOrig">원본</button></div>
  </div>
  <div id="warnReflow" class="warnbar" style="display:none">원본(한글 파일)과 표·배치가 다르게 보일 수 있어요. 제출용 확인은 원본으로 해 주세요.</div>
  <div class="vbody" id="vBody"></div>
  <div class="vfoot" id="vFoot"></div>
</section>

<!-- ── 로딩 ── -->
<div class="loading" id="loading">
  <div class="bar"><i id="loadBar"></i></div>
  <div class="msg" id="loadMsg">문서를 여는 중이에요</div>
  <button class="cancel" id="loadCancel">그만두기</button>
</div>

<!-- ── ⋮ 바텀시트 ── -->
<div class="sheetbg" id="sheetBg"></div>
<div class="bsheet" id="menuSheet">
  <button class="bi" id="miShare">공유</button>
  <button class="bi" id="miPrint">출력</button>
  <button class="bi danger" id="miRemove">목록에서 지우기</button>
  <button class="close" id="miClose">닫기</button>
</div>

<!-- ── 암호 입력 ── -->
<div class="dlg" id="pwDlg">
  <div class="box">
    <h3>암호가 걸린 문서예요</h3>
    <p id="pwMsg">문서를 열려면 암호를 입력해 주세요.</p>
    <input type="password" id="pwInput" inputmode="text" autocomplete="off">
    <div class="row"><button class="ghost" id="pwCancel">취소</button><button class="go" id="pwGo">열기</button></div>
  </div>
</div>

<!-- ── 스낵바 ── -->
<div class="snack" id="snack"><span id="snackMsg"></span><button id="snackAct"></button></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
